<div class="auth-container">
  <div class="auth-card">
    <h2>Створити обліковий запис</h2>
    <p class="subtitle">Розпочніть свою фітнес-подорож</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="row">
        <div class="field">
          <label for="firstName">Ім'я</label>
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            placeholder="John"
            [class.error]="form.get('firstName')?.invalid && form.get('firstName')?.touched"
          />
          <span class="error-text"
                *ngIf="form.get('firstName')?.invalid && form.get('firstName')?.touched">
            Required
          </span>
        </div>

        <div class="field">
          <label for="lastName">Прізвище</label>
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            placeholder="Doe"
            [class.error]="form.get('lastName')?.invalid && form.get('lastName')?.touched"
          />
          <span class="error-text"
                *ngIf="form.get('lastName')?.invalid && form.get('lastName')?.touched">
            Обов'язково
          </span>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
        />
        <span class="error-text"
              *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Потрібна дійсна електронна адреса
        </span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-input-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="password"
            type="password"
            formControlName="password"
            placeholder="Min 8 characters"
            [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <button
            type="button"
            class="toggle-password-btn"
            (click)="showPassword.set(!showPassword())">
            <lucide-icon
              [img]="showPassword() ? EyeOff : Eye"
              size="18">
            </lucide-icon>
          </button>
        </div>
        <span class="error-text"
              *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Пароль має містити щонайменше 8 символів
        </span>
      </div>

      <div class="error-banner" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>

    </form>

    <p class="switch-link">
      Вже маєте обліковий запис?
      <a routerLink="/auth/login">Увійти</a>
    </p>
  </div>
</div>
