<div class="auth-container">
  <div class="auth-card">
    <h2>Забув пароль?</h2>
    <p class="subtitle">Введи свій email і ми надішлемо посилання</p>

    @if (!sent()) {
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="you@example.com"
                 [class.error]="form.get('email')?.invalid && form.get('email')?.touched"/>
        </div>
        @if (error()) {
          <div class="error-banner">{{ error() }}</div>
        }
        <button type="submit" class="btn-primary" [disabled]="loading()">
          {{ loading() ? 'Надсилаємо...' : 'Надіслати посилання' }}
        </button>
      </form>
    } @else {
      <div class="success-message">
        ✓ Посилання надіслано на {{ form.get('email')?.value }}
      </div>
    }

    <p class="switch-link"><a routerLink="/auth/login">← Повернутись до входу</a></p>
  </div>
</div>
